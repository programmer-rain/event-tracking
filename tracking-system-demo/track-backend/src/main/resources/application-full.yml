# ============================================================
# full 生产架构模式：Kafka + Redis + ClickHouse
# 启动前先执行：docker compose up -d
# 启动命令：mvn spring-boot:run -Dspring-boot.run.profiles=full
# ============================================================
spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: 1                      # 埋点容忍极少量丢失换吞吐；金融级再上 all
      retries: 3
      batch-size: 65536
      linger-ms: 20                # 攒 20ms 再发，吞吐翻倍
      compression-type: lz4
      properties:
        enable.idempotence: true   # 生产者幂等，与 Redis 去重双保险
    consumer:
      group-id: track-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false    # 手动提交 offset：处理成功才提交
      max-poll-records: 500

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:clickhouse://localhost:8123/mall_track
    username: default
    password: ""
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver

logging:
  level:
    org.apache.kafka: warn
